[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "occjepa"
version = "0.1.0"
description = "OccJEPA: Occlusion as Masking for Amodal Video Segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["occjepa*"]

[tool.setuptools.package-data]
occjepa = ["resources/*.json"]
